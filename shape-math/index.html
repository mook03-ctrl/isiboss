  <body>

    <script>
      (() => {
        const COLS = 6;
        const ROWS = 6;
        const STORAGE_KEY = "math_puzzle_high_scores";
        const SCORE_URL = "https://crudcrud.com/api/1fb6a4cd9b9a4ec0aca9ac68221f4cea/scores";
        const TIME_MAX = 60;
        const SHAPES = [
          { id: "tri", glyph: "△" },
          { id: "sq", glyph: "□" },
          { id: "heart", glyph: "♥" },
          { id: "spade", glyph: "♠" },
        ];
        const RANKS = ["🥇", "🥈", "🥉", "4th", "5th"];

        const state = {
          name: "MathExplorer",
          score: 0,
          seenLevel: 1,
          board: [],
          values: {},
          activeIds: [],
          eqs: [],
          claimed: false,
          target: 0,
          path: [],
          dragging: false,
          touchId: null,
          running: false,
          paused: false,
          pausedByBoard: false,
          over: false,
          resolving: false,
          timeLeft: TIME_MAX,
          lastTs: 0,
          sound: true,
          latest: null,
          clears: 0,
          scores: [],
        };

        const nodes = [];
        let rafId = 0;
        let audioCtx = null;
        let toastTimer = 0;
        let lastTouchAt = 0;
        const $ = (id) => document.getElementById(id);

        function glyphOf(id) {
          const found = SHAPES.find((shape) => shape.id === id);
          return found ? found.glyph : "";
        }
        function level() { return Math.floor(state.score / 500) + 1; }
        function shapeCount(lv) { return lv <= 2 ? 2 : lv <= 4 ? 3 : 4; }
        function sumCap(lv) { return lv <= 2 ? 10 : lv <= 4 ? 15 : 25 + Math.max(0, lv - 5) * 2; }
        function drainRate() { return 1 + (level() - 1) * 0.07; }
        function keyOf(x, y) { return y * COLS + x; }
        function xyOf(index) { return { x: index % COLS, y: (index / COLS) | 0 }; }
        function wait(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
        function todayString() {
          const date = new Date();
          return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
        }
        function shuffle(arr) {
          for (let i = arr.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
          }
          return arr;
        }
        function adjacent(a, b) {
          const pa = xyOf(a);
          const pb = xyOf(b);
          return Math.abs(pa.x - pb.x) + Math.abs(pa.y - pb.y) === 1;
        }
        function cellValue(index) {
          const pos = xyOf(index);
          const cell = state.board[pos.y][pos.x];
          return cell ? state.values[cell.id] : 0;
        }
        function pathSum(path) {
          return path.reduce((total, index) => total + cellValue(index), 0);
        }

        function beep(freq, dur, type, gain) {
          if (!state.sound) return;
          try {
            audioCtx = audioCtx || new AudioContext();
            if (audioCtx.state === "suspended") audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const amp = audioCtx.createGain();
            osc.type = type || "sine";
            osc.frequency.value = freq;
            amp.gain.value = gain;
            amp.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(amp);
            amp.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
          } catch (err) { /* audio is optional */ }
        }
        function toast(message) {
          const el = $("toast");
          el.textContent = message;
          el.classList.remove("hidden");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.add("hidden"), 1500);
        }

        function buildEquations(ids, map) {
          const eq = (terms) => ({ terms, sum: terms.reduce((total, id) => total + map[id], 0) });
          if (ids.length === 2) {
            const [a, b] = ids;
            return [eq([a, b]), eq([a, b, b])];
          }
          if (ids.length === 3) {
            const [a, b, c] = ids;

        function pickNewValue(id) {

          for (const value of options) {

            terms.forEach((id, offset) => { state.board[y][x0 + offset] = { id }; });
            return;
          }
          const x = Math.floor(Math.random() * COLS);

        function pickMission() {

          const modest = fresh.filter((sum) => sum <= sumCap(level()) + 4);
          const pool = modest.length ? modest : fresh;
          if (pool.length) {
            state.target = pool[Math.floor(Math.random() * pool.length)];
            return;

          for (let attempt = 0; attempt < 50; attempt += 1) {
            const len = 1 + Math.floor(Math.random() * Math.min(4, COLS));
            const terms = Array.from({ length: len }, () => ids[Math.floor(Math.random() * ids.length)]);
            const sum = terms.reduce((total, id) => total + state.values[id], 0);
            if (banned.has(sum) || sum === state.target) continue;
            state.target = sum;
            placeTerms(terms);
            return;
          }
          const id = ids[0];
          const value = state.values[id];
          let count = 1;
          while ((banned.has(value * count) || value * count === state.target) && count < COLS) count += 1;

            added.push(shape.glyph);

        function normalizeScores(raw) {

            .map((entry, index) => ({
              item: {
                id: entry._id ? String(entry._id) : "",
                name: String(entry.name).slice(0, 16),
                score: Number(entry.score) || 0,
                level: Number(entry.level) || 1,
                date: String(entry.date || ""),

              index,
            }));
          tagged.sort((a, b) => b.item.score - a.item.score || b.item.level - a.item.level || b.index - a.index);

        function readCache() {

              name: entry.name,

        function typing() {

            const glyph = document.createElement("span");
            glyph.className = "glyph";
            el.appendChild(glyph);
            grid.appendChild(el);
            nodes.push(el);
          }
        }

        const grid = $("grid");
        grid.addEventListener("touchstart", (event) => {
          if (typing()) return;
          lastTouchAt = Date.now();
          const touch = event.changedTouches[0];
          state.touchId = touch.identifier;
          beginDrag(touch.clientX, touch.clientY);
        }, { passive: true });
        grid.addEventListener("touchmove", (event) => {
          if (!state.dragging) return;
          event.preventDefault();
          const touch = [...event.changedTouches].find((item) => item.identifier === state.touchId) || event.changedTouches[0];
          if (!touch) return;
          moveDrag(touch.clientX, touch.clientY);
        }, { passive: false });
        grid.addEventListener("touchend", (event) => {
          lastTouchAt = Date.now();
          const touch = [...event.changedTouches].find((item) => item.identifier === state.touchId);
          if (!touch && state.touchId != null) return;
          endDrag();
        });
        grid.addEventListener("touchcancel", () => endDrag());
        grid.addEventListener("mousedown", (event) => {
          if (Date.now() - lastTouchAt < 500 || typing()) return;
          event.preventDefault();
          beginDrag(event.clientX, event.clientY);
        });
        window.addEventListener("mousemove", (event) => {
          if (!state.dragging || state.touchId != null) return;
          moveDrag(event.clientX, event.clientY);
        });
        window.addEventListener("mouseup", () => {
          if (state.touchId != null) return;
          endDrag();
        });
        grid.addEventListener("contextmenu", (event) => event.preventDefault());
        window.addEventListener("blur", () => { if (state.dragging) endDrag(); });
        document.addEventListener("visibilitychange", () => {
          if (!state.running || state.over) return;
          if (document.hidden) {
            state.paused = true;
            if (state.dragging) endDrag();
            return;
          }
          if (!state.pausedByBoard && $("leaderboard").classList.contains("hidden")) {
            state.paused = false;
            state.lastTs = 0;
          }
        });

        $("start-form").addEventListener("submit", (event) => { event.preventDefault(); startGame(); });
        $("start-lb").addEventListener("click", () => openLeaderboard(false));
        $("hud-lb").addEventListener("click", () => openLeaderboard(false));
        $("lb-close").addEventListener("click", closeLeaderboard);
        $("leaderboard").addEventListener("click", (event) => { if (event.target === $("leaderboard")) closeLeaderboard(); });
        $("retry-btn").addEventListener("click", startGame);
        $("check-btn").addEventListener("click", checkAnswers);
        $("sound-btn").addEventListener("click", () => {
          state.sound = !state.sound;
          $("sound-btn").textContent = state.sound ? "🔊" : "🔇";
          $("sound-btn").setAttribute("aria-label", state.sound ? "소리 끄기" : "소리 켜기");
        });
        $("guess-list").addEventListener("keydown", (event) => {
          if (event.key === "Enter") { event.preventDefault(); checkAnswers(); }
        });

        state.scores = readCache();
        buildGrid();
        renderLeaderboard();
        refreshScores();
      })();
    </script>
  </body>
</html>
