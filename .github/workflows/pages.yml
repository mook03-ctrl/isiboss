name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyKRX
        run: pip install pykrx

      - name: Bake market ticker JSON
        run: node scripts/generate-market-ticker.mjs
        continue-on-error: true

      - name: Bake TQQQ chart JSON
        run: node scripts/generate-tqqq-chart.mjs
        continue-on-error: true

      - name: Bake semiconductor stock JSON (PyKRX)
        run: python semiconductor-stock/scripts/generate-stock-json.py
        continue-on-error: true

      - name: Build semiconductor static
        working-directory: semiconductor-stock
        run: |
          npm ci
          npm run build

      - name: Stage semiconductor for Pages
        run: |
          cd semiconductor-stock
          shopt -s dotglob
          cp -r out/* .
          rm -rf out .next node_modules app components lib public
          rm -f package.json package-lock.json tsconfig.json next.config.mjs postcss.config.mjs tailwind.config.ts next-env.d.ts .gitignore README.md
          rm -rf scripts

      - name: Build capital-flow static
        working-directory: capital-flow
        run: |
          npm ci
          npm run build

      - name: Stage capital-flow for Pages
        run: |
          cd capital-flow
          shopt -s dotglob
          cp -r out/* .
          rm -rf out .next node_modules app components lib public scripts
          rm -f package.json package-lock.json tsconfig.json next.config.mjs postcss.config.mjs tailwind.config.ts next-env.d.ts .gitignore README.md

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: ".github,semiconductor-stock/node_modules,semiconductor-stock/.next,capital-flow/node_modules,capital-flow/.next"
          cname: angrywork.com
