name: Refresh market data

on:
  schedule:
    # 30분마다 (UTC) — PyKRX bake (별도 API 키 없음)
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyKRX
        run: pip install pykrx

      - name: Bake market ticker JSON
        run: node scripts/generate-market-ticker.mjs
        continue-on-error: true

      - name: Bake semiconductor stock JSON (PyKRX)
        run: python semiconductor-stock/scripts/generate-stock-json.py

      - name: Bake TQQQ chart JSON
        run: node scripts/generate-tqqq-chart.mjs
        continue-on-error: true

      - name: Snapshot baked JSON
        run: |
          mkdir -p /tmp/isiboss-bake/data /tmp/isiboss-bake/semi
          cp -f data/market-ticker.json /tmp/isiboss-bake/data/ 2>/dev/null || true
          cp -f data/tqqq-chart.json /tmp/isiboss-bake/data/ 2>/dev/null || true
          cp -f semiconductor-stock/public/data/005930.KS.json /tmp/isiboss-bake/semi/
          cp -f semiconductor-stock/public/data/000660.KS.json /tmp/isiboss-bake/semi/

      - name: Update gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p data semiconductor-stock/data
          cp -f /tmp/isiboss-bake/data/market-ticker.json data/ 2>/dev/null || true
          cp -f /tmp/isiboss-bake/data/tqqq-chart.json data/ 2>/dev/null || true
          cp -f /tmp/isiboss-bake/semi/005930.KS.json semiconductor-stock/data/
          cp -f /tmp/isiboss-bake/semi/000660.KS.json semiconductor-stock/data/
          git add data semiconductor-stock/data || true
          git diff --staged --quiet && echo "No market data changes" && exit 0
          git commit -m "chore: refresh semiconductor JSON via PyKRX [skip ci]"
          git push origin gh-pages
