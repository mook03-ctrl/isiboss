name: Refresh market ticker

on:
  schedule:
    # 30분마다 (UTC) — 한·미 장중 근사치 갱신
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bake market ticker JSON
        run: node scripts/generate-market-ticker.mjs

      - name: Update gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p data
          git checkout main -- data/market-ticker.json
          git add data/market-ticker.json
          git diff --staged --quiet && echo "No ticker changes" && exit 0
          git commit -m "chore: refresh market-ticker.json [skip ci]"
          git push origin gh-pages
