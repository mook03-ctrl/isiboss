<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>서초동 나무 괴물 — angrywork.com</title>
  <link rel="canonical" href="https://angrywork.com/seocho-tree/">
  <meta property="og:title" content="서초동 나무 괴물">
  <meta property="og:url" content="https://angrywork.com/seocho-tree/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#24170f; --paper:#f6efe2; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:#121820; color:var(--ink); font-family:"Jua","Apple SD Gothic Neo",sans-serif; }
    button, input { font-family: inherit; }
    .screen { display:none; min-height:100dvh; position:relative; }
    .screen.on { display:block; }
    .art { position:absolute; inset:0; background:#14202b center/cover no-repeat; }
    .art.plant { background-image:url("plant.jpg"); background-position:center 28%; }
    .art.grow { background-image:url("monster.jpg"); background-size:200% 100%; background-position:left center; }
    .art.monster { background-image:url("monster.jpg"); background-size:200% 100%; background-position:right center; }
    .arrow {
      position:absolute; top:42%; z-index:2; width:16vh; height:16vh; min-width:54px; min-height:54px;
      border-radius:50%; border:3px solid #24170f; background:rgba(255,244,220,.92); font-size:28px; cursor:pointer;
    }
    .arrow.left { left: max(12px, env(safe-area-inset-left)); }
    .arrow.right { right: max(12px, env(safe-area-inset-right)); }
    .caption {
      position:absolute; left:50%; bottom: max(10px, env(safe-area-inset-bottom)); transform:translateX(-50%);
      width:min(640px, calc(100% - 28px)); background:rgba(246,239,226,.94);
      border:3px solid #24170f; border-radius:18px; padding:10px 14px 12px; text-align:center; z-index:2;
    }
    h1 { margin:0; font-size:clamp(22px, 4vh, 36px); }
    .sub { margin:4px 0 8px; color:#5c4634; font-size:clamp(14px, 2.4vh, 18px); }
    .dots { display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
    .dots i { width:9px; height:9px; border-radius:50%; background:#cdb892; display:block; }
    .dots i.on { background:#24170f; }
    .rank { text-align:left; background:#fff8ec; border:2px solid #24170f; border-radius:12px; padding:6px 10px; margin-top:8px; }
    .rank h2 { margin:0 0 2px; font-size:15px; }
    .rank ol { margin:0; padding-left:18px; font-size:14px; }
    .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    button.primary, button.ghost, button.choice {
      border:3px solid #24170f; background:#ffd15c; color:#24170f; border-radius:14px;
      padding:8px 14px; font-size:18px; cursor:pointer;
    }
    button.ghost { background:#fff; }
    button.choice { background:#fff; min-width:130px; }
    button.choice.pick { background:#b7f0a8; }
    input[type=text] { width:100%; border:3px solid #24170f; border-radius:12px; padding:10px 12px; font-size:20px; }
    .panel-screen { display:none; min-height:100dvh; place-items:center; padding:16px; background:#d7ecff; }
    .panel-screen.on { display:grid; }
    .select-card, .name-card {
      width:min(920px, 96vw); background:rgba(255,250,242,.96); border:4px solid #24170f; border-radius:20px; padding:14px;
    }
    .select-card { display:grid; grid-template-columns:1.05fr .95fr; gap:12px; align-items:center; }
    .select-card img { width:100%; max-height:70dvh; object-fit:cover; border-radius:14px; border:3px solid #24170f; }
    #play { height:100dvh; background:#14110e; overflow:hidden; }
    #play.on { display:block; }
    canvas { width:100%; height:100%; display:block; touch-action:none; }
    .hud {
      position:absolute; left:10px; right:10px; top:max(6px, env(safe-area-inset-top));
      display:flex; gap:6px; justify-content:space-between; pointer-events:none; color:#fff;
      text-shadow:0 2px 0 #24170f; font-size:clamp(12px, 2.2vh, 16px);
    }
    .hud b { background:rgba(20,16,12,.55); border-radius:10px; padding:4px 8px; }
    .touch {
      position:absolute; left:0; right:0; bottom:0; height:46%;
      display:flex; justify-content:space-between; align-items:flex-end;
      padding:0 max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      pointer-events:none;
    }
    .dpad { width:34vh; height:34vh; position:relative; }
    .dpad button, .actions button {
      pointer-events:auto; touch-action:none; border:3px solid #24170f; background:rgba(255,248,236,.9);
      border-radius:50%; font-size:clamp(14px, 2.5vh, 20px); color:#24170f;
    }
    .dpad button { position:absolute; width:12vh; height:12vh; }
    #btnUp { left:11vh; top:0; }
    #btnLeft { left:0; top:11vh; }
    #btnDown { left:11vh; top:22vh; }
    #btnRight { left:22vh; top:11vh; }
    .actions { display:flex; gap:2.2vh; align-items:flex-end; }
    .actions button { width:15vh; height:15vh; }
    #btnJump { background:#ffe08a; }
    #btnAtk { background:#c9f5a4; }
    #btnUlt { background:#bdebff; }
    .modal { position:absolute; inset:0; background:rgba(12,10,8,.4); display:none; place-items:center; padding:16px; }
    .modal.on { display:grid; }
    .box { width:min(460px, 94vw); background:#fff8ec; border:4px solid #24170f; border-radius:20px; padding:16px; text-align:center; }
    .q { font-size:clamp(28px, 6vh, 42px); margin:8px 0 12px; }
    #rotateHint {
      display:none; position:absolute; inset:0; z-index:8; background:rgba(18,16,14,.88); color:#fff8ec;
      place-items:center; text-align:center; padding:24px; font-size:28px;
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #play.on #rotateHint { display:grid; }
    }
    @media (max-width: 800px) {
      .select-card { grid-template-columns:1fr; }
      .select-card img { max-height:32dvh; }
    }
  </style>
</head>
<body>
  <section class="screen title on" id="title">
    <div id="slideArt" class="art plant"></div>
    <button class="arrow left" id="prevSlide" type="button" aria-label="이전 장면">◀</button>
    <button class="arrow right" id="nextSlide" type="button" aria-label="다음 장면">▶</button>
    <div class="caption">
      <h1 id="slideTitle">씨앗을 심다</h1>
      <p class="sub" id="slideText"></p>
      <div class="dots" id="dots"></div>
      <button class="primary" id="startBtn" type="button">시작하기</button>
      <div class="rank">
        <h2>랭킹 TOP 5</h2>
        <ol id="rankList"></ol>
      </div>
    </div>
  </section>

  <section class="panel-screen" id="nameScreen">
    <div class="name-card">
      <h1>플레이어 이름</h1>
      <p class="sub">랭킹에 올라갈 이름을 입력해 주세요.</p>
      <input id="nameInput" type="text" maxlength="12" placeholder="이름" autocomplete="nickname">
      <div class="row" style="margin-top:12px">
        <button class="ghost" id="nameBack" type="button">뒤로</button>
        <button class="primary" id="nameNext" type="button">다음</button>
      </div>
    </div>
  </section>

  <section class="panel-screen" id="selectScreen">
    <div class="select-card">
      <img src="heroes.jpg" alt="제이드와 효">
      <div>
        <h1>누구로 싸울까?</h1>
        <div class="row" style="margin:8px 0">
          <button class="choice pick" id="pickJaden" type="button">Jaden · 나무 칼</button>
          <button class="choice" id="pickHyo" type="button">Hyo · 햄스터</button>
        </div>
        <p class="sub" id="whoBlurb"></p>
        <div class="row">
          <button class="ghost" id="selectBack" type="button">뒤로</button>
          <button class="primary" id="selectGo" type="button">아파트로</button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="play">
    <canvas id="cv"></canvas>
    <div class="hud">
      <b id="hudFloor">지상</b>
      <b id="hudHp">HP 100</b>
      <b id="hudScore">점수 0</b>
      <b id="hudBuff">필살 준비</b>
    </div>
    <div class="touch">
      <div class="dpad" aria-label="이동">
        <button id="btnUp" type="button">▲</button>
        <button id="btnLeft" type="button">◀</button>
        <button id="btnDown" type="button">▼</button>
        <button id="btnRight" type="button">▶</button>
      </div>
      <div class="actions">
        <button id="btnJump" type="button">점프</button>
        <button id="btnAtk" type="button">공격</button>
        <button id="btnUlt" type="button">필살</button>
      </div>
    </div>
    <div id="rotateHint">휴대폰을 가로로 돌려 주세요</div>
    <div class="modal" id="quizModal">
      <div class="box">
        <h1>초록 블록의 각성</h1>
        <p class="sub">맞히면 10초 동안 공격과 채굴이 두 배가 된다.</p>
        <div class="q" id="quizQ"></div>
        <div class="row">
          <button class="choice" id="ansA" type="button">A</button>
          <button class="choice" id="ansB" type="button">B</button>
        </div>
      </div>
    </div>
    <div class="modal" id="endModal">
      <div class="box">
        <h1 id="endTitle"></h1>
        <p id="endText"></p>
        <p id="endScore"></p>
        <button class="primary" id="endBtn" type="button">지상에서 다시 시작</button>
      </div>
    </div>
  </section>
  <script>
const TILE = 36;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const keys = new Set();
const hold = { left:false, right:false, up:false, down:false, jump:false, atk:false, ult:false };
let viewW = 960, viewH = 540;

const SLIDES = [
  { cls:'plant', title:'씨앗을 심다', text:'남자 아이와 여자 아이는 길에서 주운 빛나는 씨앗을 아파트 정원에 심었다.' },
  { cls:'grow', title:'나무가 자라다', text:'싹이 트고 시간이 지나자 나무는 아파트만큼 커졌다.' },
  { cls:'monster', title:'나무 괴물이 되다', text:'나무는 눈과 입이 불타는 괴물이 되어 아파트를 부수고 사람들을 공격했다.' }
];
let slide = 0;

const FLOORS = [
  { name:'지하 1층', foe:'두더지 괴물', kind:'mole' },
  { name:'지하 2층', foe:'개미 괴물', kind:'ant' },
  { name:'지하 3층', foe:'지네 괴물', kind:'centipede' },
  { name:'지하 4층', foe:'땅거미 괴물', kind:'spider' },
  { name:'지하 5층', foe:'고구마 괴물', kind:'potato' }
];

const state = {
  mode:'title', name:'', who:'jaden', floor:0, surface:true,
  tiles:[], cols:0, rows:0, exit:null, player:null, enemies:[],
  shots:[], balls:[], falls:[], parts:[], texts:[], blockHp:{},
  kills:0, mined:0, quizOk:0, pathOpen:false, seed:null,
  shake:0, camX:0, camY:0, quiz:null, ended:false, msg:'',
  attackLatch:false, ultLatch:false, cinematic:false, cine:0, tick:0
};

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function blank(w,h,fill){
  return Array.from({length:h}, (_,y)=>Array.from({length:w}, (_,x)=>(x===0||y===0||x===w-1||y===h-1)?'#':fill));
}

function buildSurface(){
  const W = 34, H = 12, g = blank(W, H, '.');
  const ground = 8;
  for (let x = 1; x < W - 1; x++) g[ground][x] = '#';
  for (let x = 26; x <= 30; x++) g[ground][x] = 'B';
  for (let y = ground + 1; y < H; y++) for (let x = 26; x <= 30; x++) g[y][x] = '.';
  return { tiles:g, spawn:{x:7*TILE, y:(ground-3)*TILE}, enemies:[], seed:null, exit:null };
}

function buildFloor(index){
  const W = 31, H = 19;
  const g = Array.from({length:H}, () => Array(W).fill('#'));
  const rand = mulberry32(9000 + index * 157);
  const dirs = [[2,0],[-2,0],[0,2],[0,-2]];
  const stack = [[1,1]];
  g[1][1] = '.';
  while (stack.length) {
    const [x,y] = stack[stack.length-1];
    const opts = [];
    for (const [dx,dy] of dirs) {
      const nx = x+dx, ny = y+dy;
      if (nx>0 && ny>0 && nx<W-1 && ny<H-1 && g[ny][nx]==='#') opts.push([nx,ny]);
    }
    if (!opts.length) { stack.pop(); continue; }
    const [nx,ny] = opts[Math.floor(rand()*opts.length)];
    g[(y+ny)>>1][(x+nx)>>1] = '.';
    g[ny][nx] = '.';
    stack.push([nx,ny]);
  }
  const spots = [];
  for (let y=1;y<H-2;y++) for (let x=5;x<W-3;x++) {
    if (g[y][x]==='.' && '#BDOG'.includes(g[y+1][x])) spots.push({x,y});
  }
  spots.sort((a,b)=>(b.x+b.y)-(a.x+a.y));
  const exit = spots[0] || {x:W-3,y:H-4};
  for (let y=1;y<H-1;y++) for (let x=1;x<W-1;x++) {
    if (g[y][x]!=='.') continue;
    if (x<=4 && y<=4) continue;
    if (Math.abs(x-exit.x)+Math.abs(y-exit.y)<3) continue;
    const r = rand();
    if (r<0.34) g[y][x] = 'B';
    else if (r<0.4) g[y][x] = 'G';
    else if (r<0.46) g[y][x] = 'O';
  }
  let lava = 0;
  for (let y=5;y<H-3 && lava<2+index;y++) for (let x=6;x<W-4 && lava<2+index;x++) {
    if (g[y][x]==='.' && g[y+1][x]==='#' && g[y-1][x]==='.' && rand()<0.05) { g[y][x]='L'; lava++; }
  }
  g[exit.y][exit.x] = 'D';
  const kind = FLOORS[index].kind;
  const monsters = [];
  const pockets = [];
  for (let y=1;y<H-2;y++) for (let x=6;x<W-4;x++) {
    if (g[y][x]==='.' && '#BDOG'.includes(g[y+1][x])) pockets.push({x,y});
  }
  for (let i=pockets.length-1;i>0;i--) {
    const j = Math.floor(rand()*(i+1));
    const tmp = pockets[i]; pockets[i]=pockets[j]; pockets[j]=tmp;
  }
  for (const s of pockets) {
    if (monsters.length>=5+index) break;
    if (Math.abs(s.x-exit.x)+Math.abs(s.y-exit.y)<4) continue;
    if (monsters.some(m=>Math.abs(m.tx-s.x)+Math.abs(m.ty-s.y)<4)) continue;
    monsters.push({ tx:s.x, ty:s.y, x:s.x*TILE, y:s.y*TILE, kind, small:true, opens:false });
  }
  let bx = exit.x-1, by = exit.y;
  if (g[by] && g[by][bx]!=='.') { bx = exit.x; by = Math.max(1, exit.y-1); g[by][bx]='.'; }
  monsters.push({ tx:bx, ty:by, x:bx*TILE, y:by*TILE, kind:index===4?'root':kind, small:false, opens:true });
  let seed = null;
  if (index===4) {
    const sx = Math.max(1, exit.x-1), sy = Math.max(1, exit.y-1);
    g[sy][sx] = '.';
    seed = { x:sx*TILE+4, y:sy*TILE, hp:40, open:false };
  }
  return { tiles:g, spawn:{x:TILE+4, y:TILE}, enemies:monsters, seed, exit };
}

function makePlayer(x,y){
  return { x, y, w:22, h:32, vx:0, vy:0, facing:1, hp:100, maxHp:100, onGround:false, atkCd:0, ultCd:0, awaken:0, hurt:0, swing:0 };
}
function spawnEnemy(spec){
  const floor = state.floor+1;
  const table = spec.small
    ? { mole:20, ant:22, centipede:26, spider:28, potato:24, root:80 }
    : { mole:70, ant:84, centipede:110, spider:130, potato:90, root:260 };
  const hp = table[spec.kind] + floor*6;
  return {
    x:spec.x, y:spec.y, kind:spec.kind, small:!!spec.small, opens:!!spec.opens,
    hp, maxHp:hp, facing:-1,
    w: spec.kind==='root'?52 : spec.small?20:28,
    h: spec.kind==='root'?44 : spec.small?18:26,
    vy:0, hurt:0, hop:0, alive:true
  };
}
function loadArea(surface, floor, keep){
  const prev = state.player;
  const built = surface ? buildSurface() : buildFloor(floor);
  state.surface = surface;
  state.floor = floor;
  state.tiles = built.tiles;
  state.rows = built.tiles.length;
  state.cols = built.tiles[0].length;
  state.exit = built.exit || null;
  state.blockHp = {};
  state.pathOpen = false;
  state.enemies = built.enemies.map(spawnEnemy);
  state.seed = built.seed;
  state.shots = []; state.balls = []; state.falls = []; state.parts = []; state.texts = [];
  state.player = makePlayer(built.spawn.x, built.spawn.y);
  if (keep && prev) {
    state.player.hp = prev.hp;
    state.player.awaken = prev.awaken;
    state.player.ultCd = prev.ultCd;
  }
  state.msg = surface ? '괴물 반대편 흙을 파고 지하로 들어가자' : FLOORS[floor].name+' · '+FLOORS[floor].foe+'들이 미로를 지키고 있다';
}
function tileAt(tx,ty){
  if (ty<0||tx<0||ty>=state.rows||tx>=state.cols) return '#';
  return state.tiles[ty][tx];
}
function solidType(t){ return t==='#'||t==='B'||t==='O'||t==='G'||t==='D'; }
function hits(box){
  const x0=Math.floor(box.x/TILE), x1=Math.floor((box.x+box.w-0.01)/TILE);
  const y0=Math.floor(box.y/TILE), y1=Math.floor((box.y+box.h-0.01)/TILE);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (solidType(tileAt(x,y))) return true;
  return false;
}
function moveBody(ent){
  const sx=Math.sign(ent.vx); let n=Math.abs(ent.vx);
  while (n>0){ ent.x+=sx; if (hits(ent)){ ent.x-=sx; ent.vx=0; break; } n-=1; }
  ent.onGround=false;
  const sy=Math.sign(ent.vy); n=Math.abs(ent.vy);
  while (n>0){ ent.y+=sy; if (hits(ent)){ ent.y-=sy; if (sy>0) ent.onGround=true; ent.vy=0; break; } n-=1; }
}
function overlaps(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function scoreNow(){
  const hp = state.player ? Math.max(0, state.player.hp) : 0;
  return state.kills*100 + state.mined*10 + state.quizOk*500 + Math.ceil(hp)*50;
}
function burst(x,y,color,n){
  for (let i=0;i<n;i++) state.parts.push({ x,y, vx:(Math.random()-0.5)*4, vy:(Math.random()-1.2)*3, life:20+Math.random()*14, color });
}
function floatText(x,y,text,color){ state.texts.push({x,y,text,color,life:42}); }

function makeQuiz(floor){
  const f = Math.min(5, Math.max(1, floor));
  const mul = Math.random() < (f>=4 ? 0.35 : 0.62);
  let q, ans;
  if (mul) {
    const a = 2+Math.floor(Math.random()*([4,6,8,8,8][f-1]));
    const b = 2+Math.floor(Math.random()*([4,5,7,8,8][f-1]));
    q = a+' × '+b; ans = a*b;
  } else {
    const d = 2+Math.floor(Math.random()*([3,4,6,7,8][f-1]));
    const k = 2+Math.floor(Math.random()*([4,6,8,10,12][f-1]));
    q = (d*k)+' ÷ '+d; ans = k;
  }
  let wrong = ans + (Math.random()<0.5 ? 2+Math.floor(Math.random()*5) : -(1+Math.floor(Math.random()*3)));
  if (wrong===ans || wrong<=0) wrong = ans+4;
  const flip = Math.random()<0.5;
  return { q, A:flip?wrong:ans, B:flip?ans:wrong, correct:flip?'B':'A' };
}
function openQuiz(){
  state.quiz = makeQuiz((state.floor||0)+1);
  document.getElementById('quizQ').textContent = state.quiz.q;
  document.getElementById('ansA').textContent = 'A. '+state.quiz.A;
  document.getElementById('ansB').textContent = 'B. '+state.quiz.B;
  document.getElementById('quizModal').classList.add('on');
}
function closeQuiz(){ state.quiz=null; document.getElementById('quizModal').classList.remove('on'); }
function answerQuiz(letter){
  if (!state.quiz) return;
  const ok = letter===state.quiz.correct;
  closeQuiz();
  if (ok) {
    state.quizOk++;
    state.player.awaken = 600;
    floatText(state.player.x, state.player.y-18, '각성! 2배', '#ffe14a');
    burst(state.player.x, state.player.y, '#ffe14a', 14);
  } else {
    floatText(state.player.x, state.player.y-18, '틀렸어', '#ff8d7a');
    state.shake = 6;
  }
}
function breakTile(tx,ty){
  const t = tileAt(tx,ty);
  if (!solidType(t) || t==='#') return;
  if (t==='D' && !state.pathOpen) return;
  const key = tx+','+ty;
  const max = (t==='B'||t==='D') ? 2 : 3;
  const left = (state.blockHp[key] ?? max) - (state.player.awaken>0 ? 2 : 1);
  if (left>0) { state.blockHp[key]=left; burst(tx*TILE+16, ty*TILE+16, '#c4a27a', 3); return; }
  delete state.blockHp[key];
  state.tiles[ty][tx] = t==='D' ? 'E' : '.';
  state.mined++;
  burst(tx*TILE+16, ty*TILE+16, t==='G'?'#8dde78':'#c48a52', 7);
  if (t==='O') state.falls.push({ x:tx*TILE+8, y:(ty-1)*TILE, w:18, h:14, vy:0 });
  if (t==='G') openQuiz();
}
function mineFacing(){
  const p = state.player;
  if (hold.down || keys.has('arrowdown') || keys.has('s')) {
    breakTile(Math.floor((p.x+p.w/2)/TILE), Math.floor((p.y+p.h+6)/TILE));
    return;
  }
  const tx = Math.floor((p.x+p.w/2+p.facing*TILE*0.85)/TILE);
  const ty = Math.floor((p.y+p.h*0.45)/TILE);
  breakTile(tx,ty); breakTile(tx, ty+1);
  breakTile(Math.floor((p.x+p.w/2)/TILE), Math.floor((p.y+p.h+4)/TILE));
}
function mineWorld(wx,wy){
  const p = state.player;
  if (Math.hypot(wx-(p.x+p.w/2), wy-(p.y+p.h/2))>TILE*2.6) return;
  breakTile(Math.floor(wx/TILE), Math.floor(wy/TILE));
}
function damageEnemy(e,dmg){
  if (!e.alive) return;
  e.hp -= dmg; e.hurt = 8;
  floatText(e.x, e.y-6, String(Math.round(dmg)), '#fff7d6');
  if (e.hp<=0) {
    e.alive = false; state.kills++;
    burst(e.x+e.w/2, e.y+e.h/2, '#d7ff9a', 10);
    if (!state.enemies.some(x=>x.opens && x.alive)) {
      state.pathOpen = true;
      if (state.exit) state.tiles[state.exit.y][state.exit.x] = 'E';
      for (let y=0;y<state.rows;y++) for (let x=0;x<state.cols;x++) if (state.tiles[y][x]==='D') state.tiles[y][x]='B';
      if (state.seed) state.seed.open = true;
      state.msg = '우두머리가 쓰러졌다. 더 깊이 내려갈 길이 열렸다.';
    }
    checkClear();
  }
}
function hurtPlayer(n){
  const p = state.player;
  if (p.hurt>0 || state.ended || state.cinematic) return;
  p.hp -= n; p.hurt = 26; state.shake = 7;
  if (p.hp<=0) { p.hp=0; finish(false); }
}
function hitSeed(dmg){
  if (!state.seed || !state.seed.open) return;
  state.seed.hp -= dmg;
  floatText(state.seed.x, state.seed.y, String(Math.round(dmg)), '#d7ff9a');
  burst(state.seed.x, state.seed.y, '#c6ff73', 8);
  if (state.seed.hp<=0) { state.seed.hp=0; checkClear(); }
}
function checkClear(){
  if (state.surface || state.floor<4 || state.cinematic || state.ended) return;
  const monsters = state.enemies.some(e=>e.alive);
  const seed = state.seed && state.seed.hp>0;
  if (!monsters && !seed) startEnding();
  else if (!seed && monsters) state.msg = '씨앗은 부서졌다. 남은 괴물도 쓰러뜨려라.';
  else if (!monsters && seed) state.msg = '괴물은 사라졌다. 힘의 씨앗을 파괴해라.';
}
function attack(){
  const p = state.player;
  if (p.atkCd>0 || state.cinematic) return;
  p.atkCd = p.awaken>0 ? 9 : 15;
  p.swing = 8;
  const power = (state.who==='jaden'?14:10) * (p.awaken>0?2:1);
  mineFacing();
  if (state.who==='jaden') {
    const box = { x:p.x+(p.facing>0?p.w-2:-34), y:p.y+2, w:36, h:26 };
    state.enemies.forEach(e=>{ if (e.alive && overlaps(box,e)) damageEnemy(e, power); });
    if (state.seed && state.seed.open && overlaps(box, seedBox())) hitSeed(power);
  } else {
    state.shots.push({ x:p.x+p.w/2, y:p.y+6, vx:p.facing*6.4, vy:-0.4, life:40, dmg:power, w:16, h:14 });
  }
}
function seedBox(){ return { x:state.seed.x, y:state.seed.y, w:26, h:30 }; }
function ultimate(){
  const p = state.player;
  if (p.ultCd>0 || state.cinematic) return;
  p.ultCd = 480;
  const power = (state.who==='jaden'?50:22) * (p.awaken>0?2:1);
  if (state.who==='jaden') {
    state.shake = 14;
    state.msg = '엄마 소환! 등짝 스매싱!';
    state.enemies.forEach(e=>{ if (e.alive) damageEnemy(e, power); });
    if (state.seed && state.seed.open) hitSeed(power);
    burst(p.x, p.y, '#ffd0e4', 20);
  } else {
    state.msg = '귀여운 햄스터 돌격!';
    for (let i=0;i<6;i++) state.balls.push({ x:p.x, y:p.y-2+i*2, vx:p.facing*(4+i*0.15), vy:-0.6, life:64, dmg:power, w:18, h:16 });
  }
}
function inLava(p){
  const x0=Math.floor(p.x/TILE), x1=Math.floor((p.x+p.w-0.01)/TILE);
  const y0=Math.floor(p.y/TILE), y1=Math.floor((p.y+p.h-0.01)/TILE);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (tileAt(x,y)==='L') return true;
  return false;
}
function onExit(p){
  const x=Math.floor((p.x+p.w/2)/TILE), y=Math.floor((p.y+p.h*0.6)/TILE);
  return tileAt(x,y)==='E' || tileAt(x,y+1)==='E';
}
function startEnding(){
  if (state.cinematic || state.ended) return;
  state.cinematic = true;
  state.cine = 0;
  state.msg = '나무가 변하고 있다';
}
function finish(win){
  if (state.ended) return;
  state.ended = true;
  const sc = scoreNow();
  saveRank(sc);
  document.getElementById('endTitle').textContent = win ? '미션 클리어' : '지상(아파트 정원)에서 다시 시작';
  document.getElementById('endText').textContent = win
    ? '괴물과 씨앗을 모두 쓰러뜨렸다. 나무 괴물은 복숭아 열매가 열리는 아름다운 나무로 변했다.'
    : '에너지가 다했거나 용암에 빠졌다. 무너진 아파트 앞에서 다시 시작한다.';
  document.getElementById('endScore').textContent = state.name+'  ·  점수 '+sc;
  document.getElementById('endModal').classList.add('on');
  renderRank();
}
function saveRank(score){
  const row = { name:state.name||'player', score, who:state.who, at:Date.now() };
  let list = [];
  try { list = JSON.parse(localStorage.getItem('seocho-tree-top5')||'[]'); } catch (e) { list = []; }
  if (!Array.isArray(list)) list = [];
  list.push(row); list.sort((a,b)=>b.score-a.score); list = list.slice(0,5);
  localStorage.setItem('seocho-tree-top5', JSON.stringify(list));
}
function renderRank(){
  let list = [];
  try { list = JSON.parse(localStorage.getItem('seocho-tree-top5')||'[]'); } catch (e) { list = []; }
  const ol = document.getElementById('rankList');
  ol.innerHTML = list.length ? list.map(r=>'<li>'+escapeHtml(r.name)+' · '+r.score+'</li>').join('') : '<li>아직 기록이 없어요</li>';
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function update(){
  state.tick++;
  if (state.mode!=='play' || state.quiz) return;
  if (state.cinematic) {
    state.cine = Math.min(1, state.cine+0.007);
    if (state.cine>=1) finish(true);
    return;
  }
  if (state.ended) return;
  const p = state.player;
  const left = keys.has('arrowleft')||keys.has('a')||hold.left;
  const right = keys.has('arrowright')||keys.has('d')||hold.right;
  const jump = keys.has('arrowup')||keys.has('w')||keys.has(' ')||hold.jump||hold.up;
  p.vx = (right?2.7:0) - (left?2.7:0);
  if (p.vx) p.facing = Math.sign(p.vx);
  if (jump && p.onGround) { p.vy = -8.3; p.onGround = false; }
  p.vy = Math.min(11, p.vy+0.42);
  moveBody(p);
  if (p.atkCd>0) p.atkCd--;
  if (p.ultCd>0) p.ultCd--;
  if (p.awaken>0) p.awaken--;
  if (p.hurt>0) p.hurt--;
  if (p.swing>0) p.swing--;
  if (state.shake>0) state.shake--;
  const wantAtk = keys.has('j')||hold.atk;
  const wantUlt = keys.has('k')||hold.ult;
  if (wantAtk && p.atkCd===0) attack();
  if (wantUlt && !state.ultLatch) ultimate();
  state.ultLatch = wantUlt;

  if (state.surface && p.y>state.rows*TILE-4) { loadArea(false, 0, true); return; }
  if (!state.surface && (inLava(p) || p.y>state.rows*TILE+20)) { p.hp=0; finish(false); return; }
  if (!state.surface && state.pathOpen && onExit(p) && state.floor<4) { loadArea(false, state.floor+1, true); return; }

  state.enemies.forEach(e=>{
    if (!e.alive) return;
    const dir = (p.x+p.w/2)>(e.x+e.w/2) ? 1 : -1;
    const near = Math.abs(p.x-e.x)<200;
    e.facing = near ? dir : e.facing;
    e.vx = (near?dir:e.facing) * (e.small?0.8: e.kind==='ant'?1.55:1.05);
    if (e.kind==='spider' && !e.small) { e.hop++; if (e.hop>80 && e.onGround) { e.vy=-6.5; e.hop=0; } }
    e.vy = Math.min(11,(e.vy||0)+0.42);
    moveBody(e);
    if (e.hurt>0) e.hurt--;
    if (overlaps(p,e)) hurtPlayer((e.small?6:12)+state.floor);
  });
  const stepShot = (s, dig)=>{
    s.x += s.vx; s.y += s.vy; s.life--;
    const box = {x:s.x,y:s.y,w:s.w,h:s.h};
    if (hits(box)) { if (dig) breakTile(Math.floor(s.x/TILE), Math.floor(s.y/TILE)); s.life=0; return; }
    state.enemies.forEach(e=>{ if (e.alive && overlaps(box,e)) { damageEnemy(e,s.dmg); s.life=0; } });
    if (state.seed && state.seed.open && overlaps(box, seedBox())) { hitSeed(s.dmg); s.life=0; }
  };
  state.shots.forEach(s=>stepShot(s,false));
  state.balls.forEach(s=>stepShot(s,true));
  state.shots = state.shots.filter(s=>s.life>0);
  state.balls = state.balls.filter(s=>s.life>0);
  state.falls.forEach(f=>{
    f.vy = Math.min(9,f.vy+0.45); f.y += f.vy;
    if (!f.hit && overlaps(f,p)) { f.hit=true; hurtPlayer(16); }
  });
  state.falls = state.falls.filter(f=>f.y<state.rows*TILE+10);
  state.parts.forEach(pt=>{ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.12; pt.life--; });
  state.parts = state.parts.filter(pt=>pt.life>0);
  state.texts.forEach(t=>{ t.y-=0.55; t.life--; });
  state.texts = state.texts.filter(t=>t.life>0);
  const mapW = state.cols*TILE, mapH = state.rows*TILE;
  state.camX = Math.max(0, Math.min(Math.max(0, mapW-viewW), p.x+p.w/2-viewW*0.42));
  state.camY = Math.max(0, Math.min(Math.max(0, mapH-viewH), p.y+p.h/2-viewH*0.62));
  paintHud();
}
function paintHud(){
  const p = state.player;
  document.getElementById('hudFloor').textContent = state.surface ? '무너진 아파트' : FLOORS[state.floor].name;
  document.getElementById('hudHp').textContent = 'HP '+Math.max(0, Math.ceil(p.hp));
  document.getElementById('hudScore').textContent = '점수 '+scoreNow();
  document.getElementById('hudBuff').textContent = p.awaken>0 ? '각성 '+(p.awaken/60).toFixed(1)+'초' : (p.ultCd>0 ? '필살 '+(p.ultCd/60).toFixed(0)+'초' : '필살 준비');
}

function draw(){
  if (state.mode!=='play') return;
  ctx.clearRect(0,0,viewW,viewH);
  if (state.cinematic) { drawEnding(state.cine); return; }
  ctx.save();
  if (state.shake>0) ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);
  ctx.translate(-state.camX, -state.camY);
  if (state.surface) drawSurfaceScene();
  else {
    const sky = ctx.createLinearGradient(0,0,0,state.rows*TILE);
    sky.addColorStop(0, '#141820');
    sky.addColorStop(1, '#07080c');
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,state.cols*TILE, state.rows*TILE);
  }
  for (let y=0;y<state.rows;y++) for (let x=0;x<state.cols;x++) drawTile(x,y,state.tiles[y][x]);
  if (state.surface) drawHoleMark();
  if (state.seed) drawSeed(state.seed);
  state.falls.forEach(f=>{ roundRect(f.x,f.y,f.w,f.h,4,'#a56b3c'); });
  state.enemies.forEach(e=>{ if (e.alive) drawEnemy(e); });
  drawPlayer(state.player);
  state.shots.forEach(s=>drawHamster(s.x,s.y,1));
  state.balls.forEach(s=>drawHamster(s.x,s.y,1.15));
  state.parts.forEach(pt=>{ ctx.fillStyle=pt.color; ctx.fillRect(pt.x,pt.y,4,4); });
  state.texts.forEach(t=>{ ctx.fillStyle=t.color; ctx.font='15px Jua, sans-serif'; ctx.fillText(t.text,t.x,t.y); });
  ctx.restore();
  if (!state.surface) {
    const v = ctx.createRadialGradient(viewW/2, viewH/2, viewH*0.25, viewW/2, viewH/2, viewH*0.72);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = v;
    ctx.fillRect(0,0,viewW,viewH);
  }
  ctx.fillStyle = 'rgba(255,248,236,.92)';
  ctx.font = '15px Jua, sans-serif';
  ctx.fillText(state.msg, 16, viewH-18);
}
function drawSurfaceScene(){
  const gY = 8*TILE;
  const sky = ctx.createLinearGradient(0,0,0,gY);
  sky.addColorStop(0, '#8ec8ef');
  sky.addColorStop(1, '#d7ecff');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,state.cols*TILE, state.rows*TILE);
  drawApartment(36, gY);
  drawMonsterTree(150, gY, 0);
  ctx.fillStyle = 'rgba(90,70,50,.25)';
  ctx.beginPath(); ctx.ellipse(210, gY+8, 90, 10, 0, 0, 6.3); ctx.fill();
}
function drawApartment(x, ground){
  ctx.save();
  ctx.translate(x, ground);
  ctx.fillStyle = '#d9d4cc';
  ctx.fillRect(0, -230, 250, 230);
  ctx.fillStyle = '#b9c3bf';
  ctx.fillRect(18, -250, 70, 28);
  ctx.fillStyle = '#8d97a0';
  for (let r=0;r<4;r++) for (let c=0;c<3;c++) {
    const broken = (r+c)%3===0;
    ctx.fillStyle = broken ? '#243040' : '#d5f1ff';
    ctx.fillRect(20+c*70, -200+r*52, 42, 32);
    if (broken) { ctx.strokeStyle = '#e8eef2'; ctx.beginPath(); ctx.moveTo(22+c*70,-198+r*52); ctx.lineTo(58+c*70,-170+r*52); ctx.stroke(); }
  }
  ctx.fillStyle = '#6d5848';
  ctx.fillRect(150, -78, 70, 16);
  ctx.fillStyle = '#9aa3aa';
  ctx.fillRect(168, -108, 36, 22);
  ctx.fillStyle = '#8a8178';
  ctx.beginPath(); ctx.moveTo(210,-40); ctx.lineTo(280,-8); ctx.lineTo(150,-8); ctx.fill();
  ctx.fillStyle = '#5c5148';
  ctx.fillRect(-10, -16, 40, 16);
  ctx.fillRect(230, -20, 54, 20);
  ctx.restore();
}
function drawMonsterTree(x, ground, morph){
  ctx.save();
  ctx.translate(x, ground);
  const leaf = mix('#2f6a32', '#7ed36a', morph);
  ctx.fillStyle = leaf;
  for (let i=0;i<7;i++) {
    const a = i/7*6.28;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a)*34, -150+Math.sin(a)*18, 28, 22, a, 0, 6.3);
    ctx.fill();
  }
  ctx.fillStyle = mix('#6b4a2e', '#8a5a32', morph);
  ctx.fillRect(-18, -120, 36, 120);
  ctx.strokeStyle = '#3d2a1c'; ctx.strokeRect(-18, -120, 36, 120);
  const face = 1-morph;
  ctx.globalAlpha = face;
  ctx.fillStyle = '#ffcf4a';
  eye(-8,-78); eye(8,-78);
  ctx.fillStyle = '#7a1d1d';
  ctx.beginPath(); ctx.ellipse(0,-58,10,8,0,0,6.28); ctx.fill();
  ctx.fillStyle = '#f4efe6';
  for (let i=-1;i<=1;i++) ctx.fillRect(i*6-2,-62,4,6);
  ctx.globalAlpha = 1;
  if (morph>0.05) {
    ctx.globalAlpha = morph;
    const peaches = [[-20,-160],[18,-150],[0,-132],[28,-176],[-30,-138],[8,-182]];
    peaches.forEach(([px,py],i)=>{
      ctx.fillStyle = i%2 ? '#ff8fab' : '#ffb35c';
      ctx.beginPath(); ctx.arc(px,py,7,0,6.3); ctx.fill();
      ctx.strokeStyle = '#2f6a32'; ctx.beginPath(); ctx.moveTo(px,py-7); ctx.lineTo(px+3,py-12); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function eye(x,y){
  ctx.beginPath(); ctx.ellipse(x,y,5,3.2,0,0,6.3); ctx.fill();
  ctx.fillStyle = '#fff4c4';
  ctx.beginPath(); ctx.arc(x,y,1.4,0,6.3); ctx.fill();
  ctx.fillStyle = '#ffcf4a';
}
function drawHoleMark(){
  ctx.fillStyle = '#24170f';
  ctx.font = '16px Jua, sans-serif';
  ctx.fillText('여기 파기', 25.2*TILE, 8*TILE-14);
}
function drawSeed(s){
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.fillStyle = s.open ? '#d9ff73' : '#66724a';
  ctx.beginPath(); ctx.ellipse(12,16,10,14,0,0,6.3); ctx.fill();
  ctx.strokeStyle = '#24170f'; ctx.stroke();
  ctx.fillStyle = '#24170f'; ctx.font = '12px Jua, sans-serif'; ctx.fillText('씨앗', 0, 8);
  ctx.restore();
}
function drawEnding(t){
  const sky = ctx.createLinearGradient(0,0,0,viewH);
  sky.addColorStop(0, mix('#203044', '#9ad0f5', t));
  sky.addColorStop(1, mix('#121418', '#e7f6cf', t));
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,viewW,viewH);
  const ground = viewH*0.78;
  drawApartment(viewW*0.12, ground);
  drawMonsterTree(viewW*0.48, ground, t);
  ctx.fillStyle = mix('#3a332c', '#67a34a', t);
  ctx.fillRect(0, ground, viewW, viewH-ground);
  ctx.fillStyle = '#24170f';
  ctx.font = '28px Jua, sans-serif';
  ctx.fillText(t<0.55 ? '나무 괴물이 잠잠해진다' : '복숭아 나무가 되었다', viewW*0.28, 48);
}
function drawTile(x,y,t){
  if (t==='.'||t==='S'||t==='M') return;
  const px=x*TILE, py=y*TILE;
  const colors = { '#':'#6e7682', B:'#a56b3c', O:'#d3923e', G:'#3e9a45', D:'#6a4324', L:'#ff4d2a', E:'#f2d36a' };
  if (t==='L') {
    ctx.fillStyle = '#ff5a2a'; ctx.fillRect(px, py+10, TILE, TILE-10);
    ctx.fillStyle = 'rgba(255,220,90,.75)'; ctx.fillRect(px+6, py+16, 10, 4);
    return;
  }
  ctx.fillStyle = colors[t]||'#ccc';
  ctx.fillRect(px,py,TILE,TILE);
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(px,py,TILE,6);
  ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(px,py+TILE-6,TILE,6);
  if (t==='#'||t==='B'||t==='O'||t==='D') { ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(px+6,py+14,8,4); ctx.fillRect(px+18,py+8,7,4); }
  if (t==='G') { ctx.fillStyle='#f3ffd8'; ctx.font='18px Jua, sans-serif'; ctx.fillText('?', px+12, py+24); }
  if (t==='E') { ctx.fillStyle='#24170f'; ctx.font='18px Jua, sans-serif'; ctx.fillText('↓', px+11, py+24); }
  ctx.strokeStyle = '#24170f'; ctx.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
}
function drawPlayer(p){
  ctx.save();
  ctx.translate(p.x+p.w/2, p.y+p.h);
  if (p.facing<0) ctx.scale(-1,1);
  if (p.awaken>0) { ctx.strokeStyle='#ffe14a'; ctx.lineWidth=3; ctx.strokeRect(-16,-40,32,42); }
  if (state.who==='jaden') drawJaden(p); else drawHyo(p);
  ctx.restore();
  if (p.hurt>0 && (p.hurt%4)<2) { ctx.fillStyle='rgba(255,70,70,.28)'; roundRect(p.x-2,p.y-2,p.w+4,p.h+4,6,'rgba(255,70,70,.28)'); }
}
function drawJaden(p){
  ctx.fillStyle = '#3a312b';
  ctx.beginPath(); ctx.arc(0,-30,9,Math.PI,0); ctx.fill();
  ctx.fillRect(-9,-30,18,8);
  ctx.fillStyle = '#f3c2a5';
  ctx.beginPath(); ctx.arc(0,-24,8,0,6.3); ctx.fill();
  const blink = state.tick%180<6;
  ctx.fillStyle = '#fff';
  if (!blink) { ctx.fillRect(-5,-27,4,4); ctx.fillRect(2,-27,4,4); ctx.fillStyle='#243044'; ctx.fillRect(-4,-26,2,2); ctx.fillRect(3,-26,2,2); }
  else { ctx.fillStyle='#243044'; ctx.fillRect(-5,-25,4,1); ctx.fillRect(2,-25,4,1); }
  ctx.strokeStyle = '#c47b74'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(0,-21,3,0.15,Math.PI-0.15); ctx.stroke();
  ctx.fillStyle = '#3f86c8';
  roundRect(-11,-20,22,14,4,'#3f86c8');
  ctx.fillStyle = '#f7f7f7'; ctx.fillRect(-5,-18,10,7);
  ctx.fillStyle = '#d7c3a1'; ctx.fillRect(-8,-7,16,8);
  ctx.fillStyle = '#2c4e9e'; ctx.fillRect(-8,0,7,5); ctx.fillRect(1,0,7,5);
  ctx.fillStyle = '#c9843a';
  ctx.fillRect(-14,-16,4,7);
  ctx.fillStyle = '#16324a';
  ctx.fillRect(-15,-12,6,5);
  ctx.fillStyle = '#8ef6ff';
  ctx.beginPath(); ctx.arc(-12,-9,3.1,0,6.3); ctx.fill();
  ctx.strokeStyle = '#0b3a4a'; ctx.stroke();
  ctx.fillStyle = p.ultCd>0 ? '#8fb8c4' : '#e9fbff';
  ctx.fillRect(-13.2,-10.2,2.4,2.2);
  drawSword(p.swing);
}
function drawSword(swing){
  ctx.save();
  ctx.translate(8,-18);
  ctx.rotate(-0.9 + (8-(swing||0))*0.08);
  ctx.shadowColor = '#d5ff73';
  ctx.shadowBlur = 14;
  const g = ctx.createLinearGradient(0,0,30,0);
  g.addColorStop(0,'#6d4c2c'); g.addColorStop(0.45,'#d8ff86'); g.addColorStop(1,'#f7ffd4');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(24,-2); ctx.lineTo(30,0); ctx.lineTo(24,3); ctx.lineTo(0,4); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#2f7d32';
  ctx.fillRect(6,-1,3,2); ctx.fillRect(12,-1,3,2); ctx.fillRect(18,-1,3,2);
  ctx.fillStyle = '#8a5a32'; ctx.fillRect(-2,-2,5,6);
  ctx.restore();
}
function drawHyo(){
  ctx.fillStyle = '#6b4632';
  ctx.fillRect(7,-38,4,14);
  ctx.beginPath(); ctx.arc(0,-30,9,Math.PI,0); ctx.fill();
  ctx.fillRect(-9,-30,18,7);
  ctx.fillStyle = '#f3c2a5';
  ctx.beginPath(); ctx.arc(0,-24,8,0,6.3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-5,-27,3,3); ctx.fillRect(2,-27,3,3);
  ctx.fillStyle = '#243044'; ctx.fillRect(-4,-26,2,2); ctx.fillRect(3,-26,2,2);
  ctx.strokeStyle = '#c47b74'; ctx.beginPath(); ctx.arc(0,-21,2.4,0.2,Math.PI-0.2); ctx.stroke();
  drawHamster(-9,-34,0.55); drawHamster(7,-34,0.55);
  roundRect(-11,-19,22,13,4,'#f4f1ea');
  ctx.fillStyle = '#8a5a32'; ctx.fillRect(-8,-16,16,6);
  ctx.fillStyle = '#4e7d3e'; ctx.fillRect(-8,-7,16,8);
  ctx.fillStyle = '#c48a4a'; ctx.fillRect(-8,0,7,5); ctx.fillRect(1,0,7,5);
}
function drawHamster(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = '#e7c08a';
  ctx.beginPath(); ctx.ellipse(8,8,8,6,0,0,6.3); ctx.fill();
  ctx.fillStyle = '#f6e2c4';
  ctx.beginPath(); ctx.arc(4,3,3,0,6.3); ctx.arc(12,3,3,0,6.3); ctx.fill();
  ctx.fillStyle = '#24170f'; ctx.fillRect(10,7,2,2); ctx.fillRect(6,7,2,2);
  ctx.restore();
}
function drawEnemy(e){
  ctx.save(); ctx.translate(e.x+e.w/2, e.y+e.h); if (e.facing<0) ctx.scale(-1,1);
  const sc = e.small ? 0.72 : 1;
  ctx.scale(sc, sc);
  if (e.kind==='mole') {
    ctx.fillStyle='#6d4b34'; roundRect(-16,-20,32,18,8,'#6d4b34');
    ctx.fillStyle='#f0c9a0'; ctx.fillRect(4,-16,12,10);
    ctx.fillStyle='#ffb703'; ctx.fillRect(6,-13,8,4);
    ctx.fillStyle='#24170f'; ctx.fillRect(8,-12,2,2);
  } else if (e.kind==='ant') {
    ctx.fillStyle='#c4322a';
    ctx.beginPath(); ctx.ellipse(-6,-8,6,5,0,0,6.3); ctx.ellipse(6,-9,7,6,0,0,6.3); ctx.fill();
    ctx.strokeStyle='#24170f'; ctx.beginPath(); ctx.moveTo(8,-14); ctx.lineTo(10,-20); ctx.moveTo(4,-14); ctx.lineTo(2,-20); ctx.stroke();
  } else if (e.kind==='centipede') {
    ctx.fillStyle='#d16518';
    for (let i=0;i<4;i++) { ctx.beginPath(); ctx.ellipse(-16+i*10,-8,6,5,0,0,6.3); ctx.fill(); }
  } else if (e.kind==='spider') {
    ctx.fillStyle='#3a2748';
    ctx.beginPath(); ctx.ellipse(0,-10,11,8,0,0,6.3); ctx.fill();
    ctx.strokeStyle='#24170f';
    [[-8,-8,-16,-16],[-4,-12,-8,-20],[6,-12,12,-20],[10,-8,18,-14]].forEach(([a,b,c,d])=>{ ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.stroke(); });
    ctx.fillStyle='#ff5a7a'; ctx.fillRect(-4,-12,3,3); ctx.fillRect(3,-12,3,3);
  } else if (e.kind==='potato') {
    ctx.fillStyle='#e39a3c';
    ctx.beginPath(); ctx.ellipse(0,-10,14,9,0.2,0,6.3); ctx.fill();
    ctx.fillStyle='#24170f'; ctx.fillRect(-6,-12,3,3); ctx.fillRect(3,-12,3,3);
    ctx.strokeStyle='#a86420'; ctx.beginPath(); ctx.arc(0,-6,4,0.2,Math.PI-0.2); ctx.stroke();
  } else {
    ctx.fillStyle='#5e7038'; roundRect(-24,-28,48,26,6,'#5e7038');
    ctx.fillStyle='#ffb703'; ctx.fillRect(-8,-20,7,5); ctx.fillRect(6,-20,7,5);
    ctx.fillStyle='#7a1f1f'; ctx.fillRect(-6,-12,16,7);
  }
  ctx.restore();
  ctx.fillStyle='#24170f'; ctx.fillRect(e.x, e.y-7, e.w, 4);
  ctx.fillStyle = e.small ? '#ffb057' : '#ff5d5d';
  ctx.fillRect(e.x, e.y-7, e.w*Math.max(0,e.hp/e.maxHp), 4);
}
function roundRect(x,y,w,h,r,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.fill();
}
function mix(a,b,t){
  const pa = [1,3,5].map(i=>parseInt(a.slice(i,i+2),16));
  const pb = [1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
  const c = pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

function resizeCanvas(){
  const rect = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio||1);
  viewW = Math.max(280, rect.width);
  viewH = Math.max(160, rect.height);
  cv.width = Math.floor(viewW*dpr);
  cv.height = Math.floor(viewH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }
function show(id){
  document.querySelectorAll('.screen, .panel-screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function renderSlide(){
  const s = SLIDES[slide];
  const art = document.getElementById('slideArt');
  art.className = 'art '+s.cls;
  document.getElementById('slideTitle').textContent = s.title;
  document.getElementById('slideText').textContent = s.text;
  document.getElementById('dots').innerHTML = SLIDES.map((_,i)=>'<i class="'+(i===slide?'on':'')+'"></i>').join('');
}
function goLandscape(){
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
}
function beginRun(){
  state.kills=0; state.mined=0; state.quizOk=0; state.ended=false; state.cinematic=false; state.cine=0; state.mode='play';
  document.getElementById('endModal').classList.remove('on');
  closeQuiz();
  loadArea(true, 0);
  show('play');
  resizeCanvas();
  if (matchMedia('(pointer:coarse)').matches) goLandscape();
}
function pick(who){
  state.who = who;
  document.getElementById('pickJaden').classList.toggle('pick', who==='jaden');
  document.getElementById('pickHyo').classList.toggle('pick', who==='hyo');
  document.getElementById('whoBlurb').textContent = who==='jaden'
    ? '제이드는 빛나는 나무 칼과 손목의 시계를 가졌다. 시계로 엄마 등짝 스매싱을 부른다.'
    : '효는 머리핀 햄스터를 날리고, 필살기로 햄스터 군단을 굴려 길과 적을 쓸어 버린다.';
}

document.getElementById('prevSlide').onclick = ()=>{ slide = (slide+SLIDES.length-1)%SLIDES.length; renderSlide(); };
document.getElementById('nextSlide').onclick = ()=>{ slide = (slide+1)%SLIDES.length; renderSlide(); };
document.getElementById('startBtn').onclick = ()=>{ state.mode='name'; show('nameScreen'); document.getElementById('nameInput').focus(); };
document.getElementById('nameBack').onclick = ()=>{ state.mode='title'; show('title'); };
document.getElementById('nameNext').onclick = ()=>{
  const n = document.getElementById('nameInput').value.trim();
  if (!n) { document.getElementById('nameInput').focus(); return; }
  state.name = n; state.mode='select'; show('selectScreen');
};
document.getElementById('pickJaden').onclick = ()=>pick('jaden');
document.getElementById('pickHyo').onclick = ()=>pick('hyo');
document.getElementById('selectBack').onclick = ()=>{ state.mode='name'; show('nameScreen'); };
document.getElementById('selectGo').onclick = beginRun;
document.getElementById('ansA').onclick = ()=>answerQuiz('A');
document.getElementById('ansB').onclick = ()=>answerQuiz('B');
document.getElementById('endBtn').onclick = beginRun;
let swipeX = 0;
document.getElementById('slideArt').addEventListener('pointerdown', e=>{ swipeX = e.clientX; });
document.getElementById('slideArt').addEventListener('pointerup', e=>{
  const d = e.clientX-swipeX;
  if (d>40) document.getElementById('prevSlide').click();
  if (d<-40) document.getElementById('nextSlide').click();
});
addEventListener('keydown', e=>{
  keys.add(e.key.toLowerCase());
  if (state.mode==='title' && e.key==='ArrowRight') document.getElementById('nextSlide').click();
  if (state.mode==='title' && e.key==='ArrowLeft') document.getElementById('prevSlide').click();
  if ([' ','arrowup','arrowdown'].includes(e.key.toLowerCase()) && state.mode==='play') e.preventDefault();
  if (state.quiz && (e.key.toLowerCase()==='a'||e.key==='1')) answerQuiz('A');
  if (state.quiz && (e.key.toLowerCase()==='b'||e.key==='2')) answerQuiz('B');
});
addEventListener('keyup', e=>keys.delete(e.key.toLowerCase()));
cv.addEventListener('pointerdown', e=>{
  if (e.button!==0) return;
  attack();
  const r = cv.getBoundingClientRect();
  mineWorld((e.clientX-r.left)*(viewW/r.width)+state.camX, (e.clientY-r.top)*(viewH/r.height)+state.camY);
});
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); ultimate(); });
function bindHold(id, key){
  const el = document.getElementById(id);
  const down = ev=>{ ev.preventDefault(); hold[key]=true; };
  const up = ()=>{ hold[key]=false; };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
bindHold('btnLeft','left'); bindHold('btnRight','right'); bindHold('btnUp','up'); bindHold('btnDown','down');
bindHold('btnJump','jump'); bindHold('btnAtk','atk'); bindHold('btnUlt','ult');
addEventListener('resize', resizeCanvas);
pick('jaden');
renderSlide();
renderRank();
resizeCanvas();
requestAnimationFrame(loop);
  </script>
</body>
</html>
