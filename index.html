<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>다 때려쳐 @office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=25" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="title-bar sketch-border">
        <h1 class="game-title">다 때려쳐 @office</h1>
      </header>

      <div class="game-stage">
      <main id="game-screen" class="game-screen sketch-border" aria-label="게임 화면">
        <div id="office-scene" class="office-scene">
          <!-- 모니터 뒤: 평소엔 가려짐 -->
          <div id="behind-zone" class="behind-zone" aria-hidden="true">
            <div class="office-wall">사무실</div>
            <div id="boss-desk" class="boss-desk">
              <div class="boss-desk-top"></div>
            </div>
            <figure id="boss" class="boss" aria-label="상사">
              <p class="boss-label-top">직장 상사</p>
              <div id="boss-speech" class="boss-speech" hidden>으악~~</div>
              <div class="boss-head">
                <div class="boss-hair-back" aria-hidden="true">
                  <svg
                    class="boss-hair-lines"
                    viewBox="0 0 100 92"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      class="boss-hair-outline"
                      d="M12 78 Q14 28 50 14 Q86 28 88 78 Q82 84 50 86 Q18 84 12 78"
                      fill="none"
                      stroke="#141414"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M24 76 Q26 32 50 22 Q74 32 76 76"
                      fill="none"
                      stroke="#141414"
                      stroke-width="2"
                      stroke-linecap="round"
                    />
                    <path
                      d="M20 18 Q16 42 22 72"
                      fill="none"
                      stroke="#141414"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    />
                    <path
                      d="M34 16 Q30 48 36 74"
                      fill="none"
                      stroke="#141414"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    />
                    <path
                      d="M50 14 L48 78"
                      fill="none"
                      stroke="#141414"
                      stroke-width="1.6"
                      stroke-linecap="round"
                    />
                    <path
                      d="M66 16 Q70 46 64 74"
                      fill="none"
                      stroke="#141414"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    />
                    <path
                      d="M80 18 Q84 44 78 70"
                      fill="none"
                      stroke="#141414"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    />
                    <path
                      d="M14 52 Q50 48 86 52"
                      fill="none"
                      stroke="#141414"
                      stroke-width="1.2"
                      stroke-linecap="round"
                      opacity="0.35"
                    />
                  </svg>
                </div>
                <div class="boss-scalp" aria-hidden="true"></div>
                <div class="boss-scalp-shine" aria-hidden="true"></div>
                <div class="boss-scratches" aria-hidden="true">
                  <span class="boss-scratch boss-scratch--1"></span>
                  <span class="boss-scratch boss-scratch--2"></span>
                  <span class="boss-scratch boss-scratch--3"></span>
                  <span class="boss-scratch boss-scratch--4"></span>
                  <span class="boss-blood boss-blood--1"></span>
                  <span class="boss-blood boss-blood--2"></span>
                  <span class="boss-blood boss-blood--3"></span>
                </div>
                <div class="boss-head-lump" aria-hidden="true">
                  <span class="boss-lump-patch"></span>
                </div>
                <span class="boss-head-back" aria-hidden="true">뒤통수</span>
                <div class="boss-hair-pull" aria-hidden="true">
                  <span class="pulled-strand pulled-strand--1"></span>
                  <span class="pulled-strand pulled-strand--2"></span>
                  <span class="pulled-strand pulled-strand--3"></span>
                  <span class="pulled-strand pulled-strand--4"></span>
                  <span class="pulled-strand pulled-strand--5"></span>
                  <span class="pulled-strand pulled-strand--6"></span>
                  <span class="pulled-strand pulled-strand--7"></span>
                </div>
              </div>
              <div class="boss-neck"></div>
              <div class="boss-shoulders">
                <span class="boss-tag" aria-label="옷 태그">개ㅅㄲ</span>
              </div>
              <div class="boss-chair-back"></div>
            </figure>
            <div id="hit-spark" class="hit-spark" aria-hidden="true"></div>

            <div id="hair-pull-fx" class="hair-pull-fx" hidden aria-hidden="true">
              <span class="pull-rope pull-rope--1"></span>
              <span class="pull-rope pull-rope--2"></span>
              <span class="pull-rope pull-rope--3"></span>
              <span class="pull-rope pull-rope--4"></span>
              <span class="pull-rope pull-rope--5"></span>
            </div>

            <figure id="heroine-scene" class="heroine-scene" hidden aria-hidden="true">
              <figcaption class="heroine-caption">여직원 출동</figcaption>
              <div class="heroine-stage">
                <img
                  class="heroine-cutout"
                  src="assets/heroine-cutout.png"
                  alt="화난 여직원이 상사 머리를 쥐어뜯는 모습"
                  width="301"
                  height="600"
                />
                <div class="heroine-hair-grab" aria-hidden="true">
                  <span class="grab-strand grab-strand--1"></span>
                  <span class="grab-strand grab-strand--2"></span>
                  <span class="grab-strand grab-strand--3"></span>
                  <span class="grab-strand grab-strand--4"></span>
                  <span class="grab-strand grab-strand--5"></span>
                </div>
                <span class="heroine-anger" aria-hidden="true">💢</span>
              </div>
            </figure>
          </div>

          <!-- 내 책상: 화면 가득 -->
          <div id="my-desk" class="my-desk">
            <div class="my-desk-surface"></div>

            <!-- 널부러진 인쇄 종이 -->
            <div class="my-papers" aria-hidden="true">
              <div class="my-paper my-paper--1">인쇄물</div>
              <div class="my-paper my-paper--2">보고서</div>
              <div class="my-paper my-paper--3">★긴급</div>
              <div class="my-paper my-paper--4"></div>
            </div>

            <div class="my-keyboard" aria-hidden="true">
              <span class="my-keyboard-label">키보드</span>
            </div>
            <div class="my-mouse" aria-hidden="true">
              <span class="my-mouse-label">마우스</span>
            </div>

            <div id="my-notebook" class="my-item my-item--notebook">수첩</div>
            <div id="my-cup" class="my-item my-item--cup">물컵</div>
            <div id="my-phone" class="my-item my-item--phone">휴대폰</div>

            <div id="my-monitor" class="my-monitor">
              <div class="my-monitor-bezel">
                <div class="my-monitor-screen">
                  <div class="screen-apps">
                    <div class="app-window app-window--excel" aria-label="엑셀">
                      <div class="app-titlebar app-titlebar--excel">Excel</div>
                      <div class="excel-grid" aria-hidden="true"></div>
                    </div>
                    <div class="app-window app-window--ppt" aria-label="파워포인트">
                      <div class="app-titlebar app-titlebar--ppt">PPT</div>
                      <div class="ppt-slide">
                        <p class="ppt-rant">ㅅㅂ 자료 ㅈㄴ 시키네</p>
                      </div>
                    </div>
                  </div>
                  <span class="my-monitor-status">업무중...</span>
                </div>
              </div>
              <div class="my-monitor-stand"></div>
            </div>
          </div>

          <div id="proj-layer" class="proj-layer"></div>
        </div>

        <div id="fx-layer" class="fx-layer" aria-live="polite"></div>
      </main>

      <aside class="site-links sketch-border" aria-label="다른 서비스">
        <a
          class="site-link-box"
          href="https://saju-match.com"
          target="_blank"
          rel="noopener noreferrer">
          사주로 애인이나 찾자
        </a>
        <a
          class="site-link-box"
          href="https://todac.me"
          target="_blank"
          rel="noopener noreferrer">
          상사 욕 몰래 남기기
        </a>
        <a
          class="site-link-box"
          href="https://easycopy.cloud"
          target="_blank"
          rel="noopener noreferrer">
          AI 질문 결과 표 추출하기
        </a>
        <span class="site-link-box site-link-box--soon">준비중</span>
        <span class="site-link-box site-link-box--soon">준비중</span>
      </aside>
      </div>

      <footer id="control-pad" class="control-pad sketch-border" aria-label="행동 버튼">
        <p class="control-pad__label">던지기 <span class="control-pad__hint">좌우로 넘기기</span></p>
        <div class="control-pad__throws-row">
          <button
            type="button"
            class="throws-nav sketch-btn"
            data-throws-nav="prev"
            aria-label="이전 물건"
            aria-controls="throws-scroll">
            ◀
          </button>
          <div
            id="throws-scroll"
            class="control-pad__throws"
            tabindex="0"
            aria-label="투척 물건 (좌우로 넘기기)">
            <button type="button" class="action-btn sketch-btn" data-action="notebook">수첩</button>
            <button type="button" class="action-btn sketch-btn" data-action="cup">물컵</button>
            <button type="button" class="action-btn sketch-btn" data-action="monitor">모니터</button>
            <button type="button" class="action-btn sketch-btn" data-action="phone">휴대폰</button>
            <button type="button" class="action-btn sketch-btn" data-action="chair">의자</button>
            <button type="button" class="action-btn sketch-btn" data-action="keyboard">키보드</button>
            <button type="button" class="action-btn sketch-btn" data-action="mouse">마우스</button>
          </div>
          <button
            type="button"
            class="throws-nav sketch-btn"
            data-throws-nav="next"
            aria-label="다음 물건"
            aria-controls="throws-scroll">
            ▶
          </button>
        </div>
        <div class="control-pad__extra" aria-label="기타 행동">
          <button type="button" class="action-btn sketch-btn" data-action="yell">소리지르기</button>
          <button type="button" class="action-btn sketch-btn" data-action="flip">책상 엎기</button>
        </div>
        <div class="control-pad__promo" aria-label="광고 보상">
          <button type="button" class="action-btn sketch-btn sketch-btn--promo" data-action="ad-special">
            광고보고 특별한 아이템 얻기
          </button>
          <button type="button" class="action-btn sketch-btn sketch-btn--promo sketch-btn--adult" data-action="ad-real">
            성인광고보고 진짜 때려치기
          </button>
        </div>
      </footer>

      <footer class="app-footer">
        <p class="app-copyright">Copyright 2026 isiboss (v0.2 by mook)</p>
      </footer>
    </div>

    <script src="sfx.js?v=6"></script>
    <script src="game.js?v=25"></script>
  </body>
</html>
