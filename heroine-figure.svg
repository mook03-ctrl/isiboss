<svg viewBox="0 0 300 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030306" />
      <stop offset="40%" stop-color="#12121a" />
      <stop offset="100%" stop-color="#282832" />
    </linearGradient>
    <linearGradient id="h-skin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fff4ec" />
      <stop offset="55%" stop-color="#f5d9c8" />
      <stop offset="100%" stop-color="#e8b8a0" />
    </linearGradient>
    <linearGradient id="h-skin-deep" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f8d4c4" />
      <stop offset="100%" stop-color="#d4a088" />
    </linearGradient>
    <linearGradient id="h-blazer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#354868" />
      <stop offset="100%" stop-color="#1a2438" />
    </linearGradient>
    <linearGradient id="h-eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e4ff" />
      <stop offset="50%" stop-color="#6eb8e8" />
      <stop offset="100%" stop-color="#3a7ab8" />
    </linearGradient>
    <linearGradient id="h-tights" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#454550" />
      <stop offset="50%" stop-color="#1e1e28" />
      <stop offset="100%" stop-color="#0a0a10" />
    </linearGradient>
    <linearGradient id="h-cleavage" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffe8dc" />
      <stop offset="100%" stop-color="#e8b0a0" />
    </linearGradient>
    <linearGradient id="h-lip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0a0b0" />
      <stop offset="100%" stop-color="#c86078" />
    </linearGradient>
    <radialGradient id="h-cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb0b8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffb0b8" stop-opacity="0" />
    </radialGradient>
    <filter id="h-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#141414" flood-opacity="0.25" />
    </filter>
    <filter id="h-face-shade">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feOffset dy="2" result="off" />
      <feFlood flood-color="#c8a090" flood-opacity="0.35" />
      <feComposite in2="off" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 바닥 그림자 -->
  <ellipse cx="148" cy="508" rx="72" ry="10" fill="#141414" opacity="0.12" />

  <!-- 긴 생머리 (뒤·옆) -->
  <g class="heroine-hair-back">
    <path
      d="M72 95 Q38 140 32 220 Q26 340 48 460 Q58 498 88 508 L118 510 Q148 500 158 460 Q172 360 168 260 Q162 160 140 110 Q118 72 72 95 Z"
      fill="url(#h-hair)"
    />
    <path
      d="M158 110 Q178 200 176 320 Q174 420 162 490"
      fill="none"
      stroke="#fff"
      stroke-width="1.5"
      opacity="0.1"
    />
    <path
      d="M52 200 Q44 300 58 420"
      fill="none"
      stroke="#fff"
      stroke-width="1"
      opacity="0.06"
    />
  </g>

  <!-- 다리 + 검정 스타킹 + 하이힐 -->
  <g class="heroine-legs">
    <path
      d="M108 368 L98 440 Q94 478 108 492 L128 494 Q142 480 138 440 L128 368 Z"
      fill="url(#h-tights)"
      stroke="#141414"
      stroke-width="1.8"
    />
    <path
      d="M152 368 L168 430 Q178 472 164 492 L192 488 Q208 468 198 420 L178 368 Z"
      fill="url(#h-tights)"
      stroke="#141414"
      stroke-width="1.8"
    />
    <path d="M104 400 L112 400" stroke="#fff" stroke-width="2" opacity="0.15" stroke-linecap="round" />
    <path d="M162 395 L172 388" stroke="#fff" stroke-width="2" opacity="0.12" stroke-linecap="round" />
    <path d="M108 492 L128 494 L132 508 Q124 514 112 512 L100 508 Z" fill="#0e0e12" stroke="#141414" stroke-width="1.5" />
    <path d="M164 492 L192 488 L196 506 Q182 514 168 510 L158 504 Z" fill="#0e0e12" stroke="#141414" stroke-width="1.5" />
    <path d="M118 508 L122 518 L108 518 Z" fill="#c81828" opacity="0.85" />
    <path d="M178 506 L184 518 L168 516 Z" fill="#c81828" opacity="0.85" />
  </g>

  <!-- 미니스커트 -->
  <g class="heroine-skirt">
    <path
      d="M88 352 Q82 368 86 382 L154 384 Q162 368 158 352 Q152 340 124 338 Q96 338 88 352 Z"
      fill="#1c2438"
      stroke="#141414"
      stroke-width="2"
    />
    <path d="M90 354 L154 356" stroke="#fff" stroke-width="0.8" opacity="0.08" />
  </g>

  <!-- 콜라병 몸통 + 블레이저 (허리 좁음) -->
  <g class="heroine-torso" filter="url(#h-glow)">
    <path
      d="M78 198 Q72 240 76 290 L82 340 Q84 352 124 354 Q164 352 166 340 L172 290 Q176 240 170 198 Q166 178 148 172 Q124 166 100 172 Q82 178 78 198 Z"
      fill="url(#h-blazer)"
      stroke="#141414"
      stroke-width="2.2"
    />
    <!-- 블레이저 열림 (옆) -->
    <path d="M78 210 L82 330" stroke="#0e1420" stroke-width="3" opacity="0.5" />
    <path d="M170 210 L166 330" stroke="#0e1420" stroke-width="3" opacity="0.5" />
  </g>

  <!-- 셔츠 + 가슴 골 -->
  <g class="heroine-cleavage">
    <path
      d="M102 198 L124 178 L146 198 L150 268 L142 298 L106 298 L98 268 Z"
      fill="#ffffff"
      stroke="#141414"
      stroke-width="1.5"
    />
    <path
      d="M108 205 Q124 218 140 205 L138 248 Q124 268 110 248 Z"
      fill="url(#h-cleavage)"
      stroke="none"
    />
    <path d="M124 218 L124 262" stroke="#d09888" stroke-width="1.2" opacity="0.55" />
    <ellipse cx="112" cy="242" rx="18" ry="16" fill="url(#h-skin-deep)" opacity="0.35" />
    <ellipse cx="136" cy="242" rx="18" ry="16" fill="url(#h-skin-deep)" opacity="0.35" />
    <path
      d="M98 232 Q112 252 124 258 Q136 252 150 232"
      fill="none"
      stroke="#141414"
      stroke-width="1"
      opacity="0.15"
    />
    <ellipse cx="108" cy="238" rx="6" ry="4" fill="#fff" opacity="0.2" />
    <ellipse cx="140" cy="238" rx="6" ry="4" fill="#fff" opacity="0.2" />
  </g>

  <!-- 가슴 실루엣 (볼륨) -->
  <g class="heroine-bust">
    <ellipse cx="108" cy="248" rx="22" ry="20" fill="url(#h-skin)" stroke="#141414" stroke-width="1.2" opacity="0.95" />
    <ellipse cx="140" cy="248" rx="22" ry="20" fill="url(#h-skin)" stroke="#141414" stroke-width="1.2" opacity="0.95" />
    <path d="M118 248 Q124 254 130 248" fill="none" stroke="#e8a898" stroke-width="1" opacity="0.4" />
  </g>

  <!-- 허리 강조 -->
  <path
    d="M96 318 Q124 328 152 318"
    fill="none"
    stroke="#141414"
    stroke-width="1"
    opacity="0.2"
  />

  <!-- 왼팔 (허리에 손) -->
  <g class="heroine-arm-left">
    <path
      d="M76 210 Q58 250 54 290 Q52 318 68 332 Q82 340 94 322 L100 280 Q102 240 88 218 Z"
      fill="url(#h-blazer)"
      stroke="#141414"
      stroke-width="1.8"
    />
    <ellipse cx="62" cy="328" rx="12" ry="10" fill="url(#h-skin)" stroke="#141414" stroke-width="1.5" />
  </g>

  <!-- 목 -->
  <path d="M112 168 L136 168 L134 188 L114 188 Z" fill="url(#h-skin-deep)" stroke="#141414" stroke-width="1.2" />

  <!-- 얼굴 (선명한 미인) -->
  <g class="heroine-head" filter="url(#h-face-shade)">
    <path
      d="M88 118 Q86 88 124 78 Q162 88 160 118 Q162 148 152 168 Q124 178 96 168 Q86 148 88 118 Z"
      fill="url(#h-skin)"
      stroke="#141414"
      stroke-width="2"
    />
    <ellipse cx="92" cy="128" rx="5" ry="7" fill="url(#h-skin)" stroke="#141414" stroke-width="1" opacity="0.7" />

    <g class="heroine-eyes">
      <path d="M96 112 Q108 106 118 112" fill="none" stroke="#2a2028" stroke-width="2.2" stroke-linecap="round" />
      <path d="M130 112 Q140 106 152 112" fill="none" stroke="#2a2028" stroke-width="2.2" stroke-linecap="round" />
      <ellipse cx="106" cy="122" rx="13" ry="15" fill="#fff" stroke="#141414" stroke-width="1.2" />
      <ellipse cx="142" cy="122" rx="13" ry="15" fill="#fff" stroke="#141414" stroke-width="1.2" />
      <ellipse cx="108" cy="124" rx="9" ry="11" fill="url(#h-eye)" />
      <ellipse cx="140" cy="124" rx="9" ry="11" fill="url(#h-eye)" />
      <ellipse cx="108" cy="126" rx="4" ry="5" fill="#1a2840" />
      <ellipse cx="140" cy="126" rx="4" ry="5" fill="#1a2840" />
      <ellipse cx="110" cy="120" rx="3" ry="3.5" fill="#fff" opacity="0.95" />
      <ellipse cx="142" cy="120" rx="3" ry="3.5" fill="#fff" opacity="0.95" />
      <ellipse cx="106" cy="128" rx="1.5" ry="2" fill="#fff" opacity="0.5" />
      <path d="M98 118 L114 116" stroke="#141414" stroke-width="1.8" stroke-linecap="round" />
      <path d="M134 116 L150 118" stroke="#141414" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <ellipse cx="98" cy="138" rx="9" ry="6" fill="url(#h-cheek)" />
    <ellipse cx="150" cy="138" rx="9" ry="6" fill="url(#h-cheek)" />

    <path d="M124 138 L124 148" stroke="#d8a898" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M116 154 Q124 160 132 154" fill="url(#h-lip)" stroke="#a84860" stroke-width="1.2" />
    <path d="M118 154 Q124 157 130 154" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.35" />
  </g>

  <!-- 앞머리 -->
  <g class="heroine-bangs">
    <path
      d="M86 108 Q92 68 124 62 Q156 68 162 108 Q158 82 124 76 Q90 82 86 108 Z"
      fill="url(#h-hair)"
      stroke="#141414"
      stroke-width="1.8"
    />
    <path d="M96 100 L106 72 L114 100" fill="url(#h-hair)" />
    <path d="M114 100 L124 68 L134 100" fill="url(#h-hair)" />
    <path d="M134 100 L144 74 L154 100" fill="url(#h-hair)" />
    <path d="M100 95 L108 78" stroke="#fff" stroke-width="0.8" opacity="0.08" />
  </g>

  <g class="heroine-clip" transform="translate(158, 72)">
    <circle r="5" fill="#eef4fc" stroke="#141414" stroke-width="1" />
    <path d="M0 -3.5 L0 3.5 M-3 0 L3 0 M-2.2 -2.2 L2.2 2.2 M2.2 -2.2 L-2.2 2.2" stroke="#7a9cc0" stroke-width="0.9" />
  </g>

  <!-- 오른팔 — 머리 쥐어뜯기 -->
  <g class="heroine-pull-arm">
    <path
      d="M162 218 Q200 195 240 165 Q275 142 292 128"
      fill="none"
      stroke="url(#h-blazer)"
      stroke-width="20"
      stroke-linecap="round"
    />
    <path
      d="M162 218 Q200 195 240 165 Q275 142 292 128"
      fill="none"
      stroke="#141414"
      stroke-width="2.2"
      stroke-linecap="round"
    />
    <path
      d="M278 132 Q290 122 300 118 Q308 118 312 126 Q314 136 304 144 Q290 150 278 142 Z"
      fill="url(#h-skin)"
      stroke="#141414"
      stroke-width="1.8"
    />
    <path d="M296 122 Q302 128 306 134" fill="none" stroke="#e8c0b0" stroke-width="1.2" stroke-linecap="round" />
    <path d="M300 126 L308 132 M302 134 L310 140" stroke="#141414" stroke-width="1" stroke-linecap="round" />
  </g>

  <g class="heroine-grasp-hair">
    <path class="grasp-path grasp-path--1" d="M308 124 C330 108 352 92 378 78" fill="none" stroke="#141414" stroke-width="2.8" stroke-linecap="round" />
    <path class="grasp-path grasp-path--2" d="M310 132 C334 118 358 104 382 92" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <path class="grasp-path grasp-path--3" d="M306 140 C328 132 350 124 374 118" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
    <path class="grasp-path grasp-path--4" d="M312 120 C336 102 360 86 386 72" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" opacity="0.55" />
    <ellipse cx="314" cy="128" rx="16" ry="11" fill="#141414" opacity="0.2" />
  </g>

  <g class="heroine-anger-mark">
    <path
      d="M188 42 L196 24 M196 42 L188 24 M192 34 L202 16 M202 34 L192 16"
      stroke="#e83838"
      stroke-width="2.8"
      stroke-linecap="round"
    />
  </g>
</svg>
